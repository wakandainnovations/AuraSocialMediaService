# This file can be used for non-secret application configuration
number.of.posts=100
number.of.videos=5
number.of.comments=50

# Adaptive polling (TrackedEntityScheduler), the same policy for X, Instagram, Reddit and YouTube.
# Each tracked movie is polled on its own timer, starting at polling.base.interval.hours. A poll that
# finds fewer than polling.busy.min_new_items new posts/tweets/comments doubles that movie's interval
# (4h -> 8h -> 16h -> 24h, capped at polling.max.interval.hours); a busy poll resets it to the base.
# Paid scrapers bill each run whether or not anything is new, so quiet movies are polled less.
# A failed poll retries after the base interval; a poll skipped while Instagram/Reddit wait for the
# relevance check (no cost) re-checks after polling.skip.retry.minutes. Intervals are kept in
# memory, so a restart puts every movie back on the base interval.
polling.base.interval.hours=4
polling.max.interval.hours=24
polling.busy.min_new_items=10
polling.skip.retry.minutes=60

# X/Twitter source for the scheduled scan:
#   apify - XApifyService via Apify Actor apidojo/twitter-scraper-lite. Default. Same behaviour as
#           XService: adaptive per-movie poll (polling.* above) for tweets newer than the last saved tweet id, plus the
#           same tiered hourly likes/replies/views refresh. ~$0.016 per query (incl. ~40 tweets).
#   api   - XService, the official X API v2 (needs x.access_token; billed per post read).
# Both share the last-saved-tweet-id per movie, so switching resumes from the same tweet.
# Switch back to "api" if the Apify results look wrong, then restart the service.
x.provider=apify
# Apify mode only. Max new tweets one poll may return (XService uses number.of.posts).
x.apify.max_items=1000
# Apify mode only. Likes/replies/views refresh, hourly, across ALL movies:
#   max_rows    - due tweets considered per cycle (100 = XService's MAX_REFRESH_PER_CYCLE)
#   max_items   - max tweets one refresh query may return
#   max_queries - max refresh searches per cycle (cost ceiling: ~10 x $0.016 + items per hour)
# Tweets not reached in a cycle stay due for the next one.
x.apify.refresh.max_rows=100
x.apify.refresh.max_items=200
x.apify.refresh.max_queries=10

# Prices used for the cost log (x_cost_log table / x_cost_daily view), both providers. Every Apify
# run and X API request is logged; Apify rows also store what Apify reported charging (charged_usd)
# and the run id. Update these if your plan's prices differ.
#   twitter-scraper-lite (hourly scan): per query, incl. the first N tweets, then per extra tweet
x.apify.cost.per_query_usd=0.016
x.apify.cost.included_items_per_query=40
x.apify.cost.per_item_usd=0.0004
#   tweet-scraper (movie backfill): per tweet
x.apify.cost.backfill_per_item_usd=0.0004
#   Official X API v2: per post read and per user object read. CHECK THESE against your X developer
#   console / plan before comparing - they are placeholders, not confirmed prices.
x.api.cost.per_post_read_usd=0.005
x.api.cost.per_user_read_usd=0.00

# One-time historical backfill (HistoricalBackfillService): past-year Instagram/Reddit collection
# for MOVIE entities in Tamil/Kannada.
backfill.instagram.results_limit=300
backfill.reddit.max_posts=300

# On-demand single-movie backfill (MovieBackfillService): result caps per platform for a
# caller-specified trailing window (e.g. "last 3 months").
backfill.x.max_items=300
backfill.youtube.max_videos=25

# Automatic release tracking (ReleaseDiscoveryService / TrackedReleaseSource). Every India-origin
# release on TMDB is written to a weekly file, release.files.dir/releases-YYYY-Www.json (one per ISO
# week, IST). Add movies TMDB doesn't list to that file's "manual" list. The standalone
# scripts/release_file_listener.py loads the latest file into tracked_releases (run it separately),
# and movies are scanned from release_date - tracking.days.before to release_date + tracking.days.after.
# Discovery also lists releases up to release.discovery.lookahead.days ahead so admins can exclude
# them in aura-radix before scanning starts. Keep the day/language settings in sync with the
# listener's options (it has the same defaults).
release.files.dir=releases
tracking.days.before=7
tracking.days.after=7
release.discovery.lookahead.days=14
# Original languages treated as Indian. A discovered release in any other language (e.g. English)
# is skipped entirely - add it from the admin UI ("Add movie") if it's worth tracking.
# Discovery also only considers India theatrical releases (TMDB release type 2/3, region IN), so
# short films, festival-only and OTT-only titles are never added.
tracking.indian.languages=hindi,tamil,telugu,kannada,malayalam,marathi,bengali,punjabi,gujarati,odia,assamese,bhojpuri,urdu,sanskrit,konkani,tulu,maithili,rajasthani
# Of those, only these are scanned by default. Releases in the other Indian languages above are
# still stored in tracked_releases but start excluded ("Auto-excluded: ... is not auto-tracked");
# restore one in the admin UI to track it.
tracking.auto.track.languages=tamil,telugu,kannada,malayalam

# Relevance check (RelevanceCheckService, hourly). A tracked movie whose collected posts are mostly
# not about the movie (generic title like "Titanic") is auto-excluded once it has at least
# relevance.min.posts posts and under relevance.min.pct percent look movie-related. Instagram/Reddit
# (paid Apify runs) wait for this check - or relevance.grace.hours after the window opens, for
# quiet releases with too few posts to judge. Restoring a movie in the admin UI exempts it.
relevance.min.posts=30
relevance.min.pct=15
relevance.grace.hours=3
relevance.auto.exclude=true
